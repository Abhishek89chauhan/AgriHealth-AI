services:
  # Backend — Node/Express API (repo root so models/ is available)
  - type: web
    name: plantgaurd-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production

  # Frontend — React static site (no plan field; static sites don't use web free plan)
  - type: web
    name: plantgaurd-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: plantgaurd-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
